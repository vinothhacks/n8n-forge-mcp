name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and verify (e.g. v0.1.0-m1 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  pre-release-gate:
    name: Pre-Release Security, Catalog & Lint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_commit: ${{ steps.release-commit.outputs.sha }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Require the release commit to be merged
        id: release-commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python & zstandard
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify the committed offline catalog bundle
        shell: bash
        run: |
          python -m pip install zstandard==0.25.0
          python - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path("tools/catalog-builder").resolve()))
          from build_catalog import verify_roundtrip_archive

          manifest = json.loads(pathlib.Path("data/catalog.manifest.json").read_text(encoding="utf-8"))
          verify_roundtrip_archive(
              pathlib.Path("data/catalog.sqlite.zst"),
              manifest["digests"]["decompressedSqliteBlake3"],
              manifest["digests"]["decompressedSqliteSha256"],
          )
          assert pathlib.Path("LICENSE").is_file(), "Missing LICENSE"
          assert pathlib.Path("docs/THIRD_PARTY_NOTICES.md").is_file(), "Missing docs/THIRD_PARTY_NOTICES.md"
          print("Verified catalog.sqlite.zst, LICENSE, and THIRD_PARTY_NOTICES.md")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify formatting, clippy, and release test suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Upload verified catalog bundle for matrix packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-catalog-bundle
          path: |
            data/catalog.sqlite.zst
            data/catalog.manifest.json
          if-no-files-found: error

  build-matrix:
    name: Build Release (${{ matrix.target }})
    needs: pre-release-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: n8n-rs-mcp.exe
            archive_ext: zip
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: n8n-rs-mcp
            archive_ext: tar.gz
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: n8n-rs-mcp
            archive_ext: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: n8n-rs-mcp
            archive_ext: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: n8n-rs-mcp
            archive_ext: tar.gz
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.pre-release-gate.outputs.release_commit }}

      - name: Download verified catalog bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-catalog-bundle
          path: data

      - name: Install aarch64 cross-compilation toolchain (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build optimized stripped release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          cargo build --release --locked --bin n8n-rs-mcp --target "${{ matrix.target }}"

      - name: Check binary size against V2 <25 MiB engineering target and stage archive
        shell: bash
        run: |
          TAG="$RELEASE_TAG"

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          if [ ! -f "${BIN_PATH}" ]; then
            echo "Expected compiled binary not found at ${BIN_PATH}" >&2
            exit 1
          fi

          BIN_BYTES=$(wc -c < "${BIN_PATH}" | tr -d '[:space:]')
          MAX_TARGET_BYTES=$((25 * 1024 * 1024))
          echo "Compiled ${BIN_PATH}: ${BIN_BYTES} bytes (engineering target <= ${MAX_TARGET_BYTES} bytes)"
          if [ "${BIN_BYTES}" -gt "${MAX_TARGET_BYTES}" ]; then
            echo "::warning::Binary size (${BIN_BYTES} bytes) exceeds 25 MiB initial engineering target; review release gate report."
          fi

          PKG_BASENAME="n8n-rs-mcp-${TAG}-${{ matrix.target }}"
          STAGE_DIR="dist-stage/${PKG_BASENAME}"
          mkdir -p "${STAGE_DIR}/data" "${STAGE_DIR}/config" "${STAGE_DIR}/examples" "${STAGE_DIR}/docs"
          mkdir -p release-out

          cp "${BIN_PATH}" "${STAGE_DIR}/${{ matrix.bin_name }}"
          cp data/catalog.sqlite.zst "${STAGE_DIR}/data/catalog.sqlite.zst"
          cp data/catalog.manifest.json "${STAGE_DIR}/data/catalog.manifest.json"
          cp config/*.toml "${STAGE_DIR}/config/"
          cp examples/* "${STAGE_DIR}/examples/"
          cp LICENSE "${STAGE_DIR}/LICENSE"
          cp README.md "${STAGE_DIR}/README.md"
          cp docs/THIRD_PARTY_NOTICES.md "${STAGE_DIR}/docs/THIRD_PARTY_NOTICES.md"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            python - "${STAGE_DIR}" "release-out/${PKG_BASENAME}.zip" <<'PY'
          import pathlib
          import sys
          import zipfile

          stage = pathlib.Path(sys.argv[1])
          out_zip = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(stage.rglob("*")):
                  if item.is_file():
                      zf.write(item, item.relative_to(stage.parent))
          PY
          else
            tar -C dist-stage -czf "release-out/${PKG_BASENAME}.tar.gz" "${PKG_BASENAME}"
          fi

      - name: Upload target release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-archive-${{ matrix.target }}
          path: release-out/*
          if-no-files-found: error

  release-metadata:
    name: Release SBOM and Checksums
    needs: [pre-release-gate, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.pre-release-gate.outputs.release_commit }}

      - name: Install Rust toolchain (for cargo metadata dependency graph)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.99.1"

      - name: Download all target release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-archive-*
          path: dist
          merge-multiple: true

      - name: Export locked Cargo dependency metadata & generate CycloneDX + SPDX SBOMs
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          cargo metadata --format-version 1 --locked > "dist/n8n-rs-mcp-${TAG}.cargo-metadata.json"

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/n8n-rs-mcp-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/n8n-rs-mcp-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          sha256sum n8n-rs-mcp-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the checksummed release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksummed-release-bundle
          path: dist/
          if-no-files-found: error

  attest-release:
    name: Attest Release Provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download checksummed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checksummed-release-bundle
          path: dist

      - name: Attest SLSA build provenance for release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/*.spdx.json
            dist/*.cargo-metadata.json
            dist/SHA256SUMS.txt

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download checksummed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checksummed-release-bundle
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: n8n-rs-mcp ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/*.spdx.json
            dist/*.cargo-metadata.json
            dist/SHA256SUMS.txt
